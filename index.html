<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ConnectX</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            color: white;
            overflow: hidden;
            background: linear-gradient(135deg, #12002f, #24105c, #0066ff);
        }

        /* =========================
           BACKGROUND
        ========================= */

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.35;
            animation: float 8s infinite ease-in-out;
            pointer-events: none;
        }

        .circle1 {
            width: 300px;
            height: 300px;
            background: #ff00cc;
            top: -100px;
            left: -80px;
        }

        .circle2 {
            width: 400px;
            height: 400px;
            background: #00eaff;
            right: -150px;
            bottom: -150px;
            animation-delay: 2s;
        }

        .circle3 {
            width: 180px;
            height: 180px;
            background: #7b00ff;
            right: 30%;
            top: 15%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-30px) scale(1.1);
            }
        }

        /* =========================
           CURSOR PARTICLES
        ========================= */

        .particle {
            position: fixed;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            pointer-events: none;

            z-index: 9999;

            background: #00eaff;

            box-shadow:
                0 0 6px #00eaff,
                0 0 12px #7b00ff;

            animation: particleFade 0.8s linear forwards;
        }

        @keyframes particleFade {

            0% {
                opacity: 1;
                transform: scale(1) translate(0, 0);
            }

            100% {
                opacity: 0;
                transform:
                    scale(0)
                    translate(
                        var(--moveX),
                        var(--moveY)
                    );
            }
        }

        /* =========================
           NAVIGATION
        ========================= */

        nav {
            height: 80px;

            display: flex;
            align-items: center;

            padding: 0 7%;

            position: relative;

            z-index: 5;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: #00eaff;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            height: calc(100vh - 80px);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 8%;

            position: relative;

            z-index: 2;
        }

        .hero-text {
            max-width: 600px;
        }

        .badge {
            display: inline-block;

            padding: 8px 15px;

            border:
                1px solid rgba(255,255,255,0.3);

            border-radius: 30px;

            background:
                rgba(255,255,255,0.08);

            margin-bottom: 20px;

            font-size: 14px;
        }

        h1 {
            font-size: clamp(50px, 7vw, 90px);

            line-height: 0.95;

            margin-bottom: 25px;
        }

        h1 span {
            color: #00eaff;
        }

        .description {
            font-size: 19px;

            line-height: 1.6;

            color: #d9dcff;

            margin-bottom: 35px;
        }

        /* =========================
           BUTTONS
        ========================= */

        button {
            border: none;

            padding: 14px 26px;

            border-radius: 30px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login {
            background: transparent;

            color: white;

            border:
                1px solid rgba(255,255,255,0.4);
        }

        .signup {
            background: #00eaff;

            color: #06102b;

            box-shadow:
                0 0 25px
                rgba(0,234,255,0.35);
        }

        button:hover {
            transform: translateY(-4px);

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.3);
        }

        .hero-buttons button {
            margin-right: 12px;
        }

        /* =========================
           CHAT PREVIEW
        ========================= */

        .preview {
            width: 390px;

            height: 470px;

            border-radius: 25px;

            padding: 20px;

            background:
                rgba(255,255,255,0.1);

            border:
                1px solid rgba(255,255,255,0.2);

            backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.3);

            animation:
                cardFloat 5s
                infinite ease-in-out;
        }

        @keyframes cardFloat {

            0%, 100% {
                transform:
                    translateY(0)
                    rotate(1deg);
            }

            50% {
                transform:
                    translateY(-12px)
                    rotate(-1deg);
            }
        }

        .preview-title {
            font-weight: bold;

            margin-bottom: 20px;

            font-size: 18px;
        }

        .online {
            color: #55ff9a;

            font-size: 12px;

            margin-top: 5px;
        }

        .message {
            padding: 13px 16px;

            border-radius: 18px;

            margin: 12px 0;

            max-width: 75%;

            font-size: 14px;
        }

        .received {
            background:
                rgba(255,255,255,0.13);
        }

        .sent {
            background: #006cff;

            margin-left: auto;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 850px) {

            body {
                overflow: auto;
            }

            .hero {
                flex-direction: column;

                justify-content: center;

                text-align: center;

                gap: 40px;
            }

            .preview {
                width: 330px;

                height: 390px;
            }

            .hero-buttons button {
                margin-bottom: 10px;
            }
        }

    </style>
</head>


<body>

    <!-- Animated background -->

    <div class="circle circle1"></div>

    <div class="circle circle2"></div>

    <div class="circle circle3"></div>


    <!-- Navigation -->

    <nav>

        <div class="logo">
            Connect<span>X</span>
        </div>

    </nav>


    <!-- Main section -->

    <section class="hero">

        <div class="hero-text">

            <div class="badge">
                ✦ A new way to communicate
            </div>

            <h1>
                Connect.<br>
                <span>Communicate.</span>
            </h1>

            <p class="description">
                Meet people, build communities and have
                meaningful conversations — all in one place.
            </p>

            <div class="hero-buttons">

                <button class="signup">
                    CREATE ACCOUNT →
                </button>

                <button class="login">
                    I HAVE AN ACCOUNT
                </button>

            </div>

        </div>


        <!-- Chat preview -->

        <div class="preview">

            <div class="preview-title">

                💬 Messages

                <div class="online">
                    ● 24 friends online
                </div>

            </div>

            <div class="message received">
                Hey! Did you see the new community?
            </div>

            <div class="message sent">
                Yeah! It looks awesome 🔥
            </div>

            <div class="message received">
                Wanna join?
            </div>

            <div class="message sent">
                Of course! 😎
            </div>

            <div class="message received">
                Let's gooo 🚀
            </div>

        </div>

    </section>


    <!-- =========================
         PARTICLE TRAIL JAVASCRIPT
    ========================= -->

    <script>

        let mouseX = 0;
        let mouseY = 0;

        let lastX = 0;
        let lastY = 0;


        document.addEventListener(
            "mousemove",
            function(event) {

                mouseX = event.clientX;
                mouseY = event.clientY;


                /* Only create particles
                   when the mouse actually moves */

                const distance = Math.sqrt(
                    Math.pow(mouseX - lastX, 2) +
                    Math.pow(mouseY - lastY, 2)
                );


                if (distance > 8) {

                    createParticle(
                        mouseX,
                        mouseY
                    );

                    lastX = mouseX;
                    lastY = mouseY;
                }

            }
        );


        function createParticle(x, y) {

            const particle =
                document.createElement("div");


            particle.classList.add(
                "particle"
            );


            /* Random size */

            const size =
                Math.random() * 5 + 2;


            particle.style.width =
                size + "px";

            particle.style.height =
                size + "px";


            /* Random movement */

            const moveX =
                (Math.random() - 0.5) * 60;

            const moveY =
                (Math.random() - 0.5) * 60;


            particle.style.setProperty(
                "--moveX",
                moveX + "px"
            );


            particle.style.setProperty(
                "--moveY",
                moveY + "px"
            );


            particle.style.left =
                x + "px";

            particle.style.top =
                y + "px";


            document.body.appendChild(
                particle
            );


            /* Delete after animation */

            setTimeout(
                function() {

                    particle.remove();

                },
                800
            );

        }

    </script>

</body>
</html>
